name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CueKit.Tests/CueKit.Tests.csproj -c Release
      - name: Check the app still builds
        run: dotnet build CueMarkerExtractorApp/CueMarkerExtractorApp.csproj -c Release
