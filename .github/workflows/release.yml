name: Release

# Push a tag like v1.0.0 to build the installer and publish a GitHub Release.
# Run manually (Actions tab → Release → Run workflow) to just build the
# artifacts without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test CueKit.Tests/CueKit.Tests.csproj -c Release

      - name: Publish self-contained win-x64 exe
        run: |
          dotnet publish CueMarkerExtractorApp/CueMarkerExtractorApp.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/win-x64
          rm -f publish/win-x64/*.pdb

      - name: Build installer (Inno Setup)
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            choco install innosetup -y --no-progress
          fi
          # MSYS_NO_PATHCONV stops Git Bash rewriting the /D switch as a path.
          MSYS_NO_PATHCONV=1 "$ISCC" "/DAppVersion=${{ steps.version.outputs.version }}" installer/CueMarkerExtractor.iss

      - name: Package portable zip
        run: |
          ZIP="CueMarkerExtractor-Portable-${{ steps.version.outputs.version }}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path publish/win-x64/CueMarkerExtractor.exe -DestinationPath installer/Output/$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: installer/Output/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/Output/* \
            --title "Cue Marker Extractor ${GITHUB_REF_NAME}" \
            --generate-notes
